[project]
name = "fastapi-ipware"
version = "0.2.0"
description = "FastAPI/Starlette-native wrapper for python-ipware to get client IP addresses"
keywords = [
    "fastapi",
    "starlette",
    "ipware",
    "ip-address",
    "client-ip",
    "proxy",
    "x-forwarded-for",
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["python-ipware>=4.1.0", "starlette>=0.49.1"]
authors = [{ name = "Michael Bianco", email = "mike@mikebian.co" }]
urls = { "Repository" = "https://github.com/iloveitaly/fastapi-ipware" }

# additional packaging information: https://packaging.python.org/en/latest/specifications/core-metadata/#license

[build-system]
requires = ["uv_build>=0.11.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# avoids the src/ directory structure
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright[nodejs]>=1.1.408",
    "ruff>=0.15.0",
    "coverage>=7.13.4",
    "pytest-cov>=7.0.0",
    "covdefaults>=2.3.0",
    "beautiful-traceback>=1.0.2",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
]

[tool.pyright]
exclude = ["examples/", "playground/", "tmp/", ".venv/", "tests/"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html:tmp/htmlcov"

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["fastapi_ipware"]

[tool.coverage.report]
fail_under = 50
